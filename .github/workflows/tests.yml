name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 22.04 masih menyediakan Python 3.9 (ubuntu-latest = 26.04 tidak).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
